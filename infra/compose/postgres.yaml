# PostgreSQL local. Usado a partir da Fase 2 (event store).
# Tag fixa de major (nunca `latest`); a tag exata será fixada quando o Flyway entrar.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: moneyout
      POSTGRES_USER: moneyout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyout -d moneyout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
