# Catálogo de versões. Fonte e data da verificação: docs/experiments/fase-0.md
# O BOM do Spring Boot é a fonte da verdade para tudo que ele gerencia (Kotlin, JUnit,
# Testcontainers, Flyway, drivers...). Aqui entram só as versões que ele NÃO gerencia.

[versions]
springBoot = "4.1.1"
kotlin = "2.3.21" # a mesma que o spring-boot-dependencies 4.1.1 gerencia
kotest = "6.2.5"
archunit = "1.5.1"
ktlintGradle = "14.2.0"

[libraries]
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
